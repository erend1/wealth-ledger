name: Verify

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Windows .NET / SQLite / Browser verification
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore local tools
        run: dotnet tool restore

      - name: Restore solution
        run: dotnet restore WealthLedger.slnx --verbosity minimal

      - name: Build solution
        run: dotnet build WealthLedger.slnx --no-restore --configuration Debug --verbosity minimal

      - name: Install pinned Chromium
        shell: pwsh
        run: pwsh tests/WealthLedger.UI.BrowserTests/bin/Debug/net10.0/playwright.ps1 install chromium

      - name: Run full test suite
        run: dotnet test WealthLedger.slnx --no-restore --no-build --configuration Debug --verbosity minimal

      - name: Verify formatting
        run: dotnet format WealthLedger.slnx --verify-no-changes --no-restore --verbosity minimal

      - name: Verify EF Core model has no pending changes
        run: >-
          dotnet ef migrations has-pending-model-changes
          --project src/WealthLedger.Infrastructure/WealthLedger.Infrastructure.csproj
          --startup-project src/WealthLedger.Infrastructure/WealthLedger.Infrastructure.csproj
          --context WealthLedgerDbContext
          --no-build
